<!DOCTYPE html>
<html lang="zh-Hans-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="🎓🍅♨️ - 高效记录进度的番茄钟" />
    <meta name="keywords" content="进度跟踪,效率工具,时间管理" />

    <!-- PWA 相关元标签 -->
    <meta name="theme-color" content="#4caf50" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="番茄钟" />
    <meta name="application-name" content="番茄钟" />
    <meta name="msapplication-TileColor" content="#4caf50" />
    <meta name="msapplication-config" content="browserconfig.xml" />

    <!-- PWA Manifest 和图标 -->
    <link rel="manifest" href="manifest.json" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234caf50'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🍅%3C/text%3E%3C/svg%3E"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%234caf50' rx='24'/%3E%3Ctext x='90' y='110' font-size='90' text-anchor='middle' fill='white'%3E🍅%3C/text%3E%3C/svg%3E"
    />

    <title>🎓🍅♨️</title>
    <!--
      页面整体说明：
      - 这是一个轻量级单页面番茄钟/专注记录应用。
      - 结构层负责展示界面；样式层负责主题与布局；脚本层负责计时、状态持久化、专注累计和 PWA 行为。
      - 代码中使用原生 HTML/CSS/JavaScript，没有引入框架，适合阅读学习和后续扩展。
    -->
    <style>
      /* CSS 变量定义 - 浅色主题 */
      :root {
        /* 背景色 */
        --bg-primary: #0f172a;
        --bg-secondary: #111c2e;
        --bg-tertiary: #14243b;

        /* 文字颜色 */
        --text-primary: #e6eefc;
        --text-secondary: #5eead4;
        --text-accent-1: #fb923c;
        --text-accent-2: #60a5fa;

        /* 边框和进度条 */
        --border-primary: #23364f;

        /* 阴影 */
        --shadow-primary: rgba(0, 0, 0, 0.35);

        /* 透明度 */
        --opacity-disabled: 0.7;
        --opacity-button-disabled: 0.5;

        /* 过渡效果 */
        --transition-base: all 0.3s ease;
        --transition-progress: width 1s linear, stroke-dashoffset 1s linear;
      }

      /* 浅色主题变量 */
      @media (prefers-color-scheme: light) {
        :root {
          --bg-primary: #f3f6fb;
          --bg-secondary: #ffffff;
          --bg-tertiary: #eef3f8;
          --text-primary: #1f2937;
          --text-secondary: #14b8a6;
          --text-accent-1: #f97316;
          --text-accent-2: #3b82f6;
          --border-primary: #d7e2ee;
          --shadow-primary: rgba(15, 23, 42, 0.08);
        }
      }

      /* 重置样式 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background:
          radial-gradient(circle at top left, rgba(96, 165, 250, 0.16), transparent 28%),
          radial-gradient(circle at bottom right, rgba(94, 234, 212, 0.16), transparent 24%),
          var(--bg-primary);
        color: var(--text-primary);
        height: 100vh;
        overflow: hidden;
        transition: var(--transition-base);
      }

      /* 主容器 */
      .container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 20px;
        gap: 20px;
        overflow: auto;
      }

      /* 标题 */
      .title {
        display: none;
        text-align: center;
        font-size: 2rem;
        margin-bottom: 10px;
      }

      /* 内容区域 */
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* 总学习时长 */
      .study-time {
        background-color: var(--bg-secondary);
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 2px 4px var(--shadow-primary);
        transition: var(--transition-base);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .focus-panel {
        background: linear-gradient(145deg, rgba(17, 28, 46, 0.98), rgba(20, 36, 59, 0.95));
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.28);
        transition: var(--transition-base);
        display: flex;
        flex-direction: column;
        gap: 12px;
        border: 1px solid rgba(96, 165, 250, 0.16);
      }

      .focus-panel.is-running {
        border: 1px solid rgba(76, 175, 80, 0.24);
        box-shadow: 0 0 0 1px rgba(76, 175, 80, 0.18), 0 12px 28px rgba(76, 175, 80, 0.14);
        animation: focusPulse 1.6s ease-in-out infinite;
      }

      @keyframes focusPulse {
        0%,
        100% {
          transform: translateY(0);
          box-shadow: 0 0 0 1px rgba(76, 175, 80, 0.16), 0 10px 24px rgba(76, 175, 80, 0.12);
        }
        50% {
          transform: translateY(-2px);
          box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.22), 0 16px 30px rgba(76, 175, 80, 0.2);
        }
      }

      .panel-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
      }

      .project-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 180px;
        overflow: auto;
      }

      .project-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid rgba(96, 165, 250, 0.14);
        background: linear-gradient(145deg, rgba(20, 36, 59, 0.98), rgba(16, 27, 44, 0.95));
        transition: var(--transition-base);
      }

      .project-item:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
      }

      .project-item.active {
        border-color: var(--text-secondary);
        background: rgba(76, 175, 80, 0.15);
      }

      .project-item.running {
        border-color: rgba(76, 175, 80, 0.3);
        box-shadow: inset 0 0 0 1px rgba(76, 175, 80, 0.14);
        animation: taskBreath 1.6s ease-in-out infinite;
      }

      @keyframes taskBreath {
        0%,
        100% {
          transform: scale(1);
          box-shadow: inset 0 0 0 1px rgba(76, 175, 80, 0.14);
        }
        50% {
          transform: scale(1.01);
          box-shadow: inset 0 0 0 2px rgba(76, 175, 80, 0.2), 0 8px 18px rgba(76, 175, 80, 0.12);
        }
      }

      .project-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(33, 150, 243, 0.12);
        color: var(--text-accent-2);
        font-size: 0.72rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .project-badge.is-running {
        background: rgba(76, 175, 80, 0.16);
        color: var(--text-secondary);
        animation: badgePulse 1.3s ease-in-out infinite;
      }

      .project-status-light {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c7c7c7;
        box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4);
        flex-shrink: 0;
      }

      .project-status-light.is-running {
        background: #4caf50;
        animation: pulseLight 1.4s infinite;
      }

      @keyframes badgePulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.03);
          opacity: 0.95;
        }
      }

      .project-toggle {
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
        padding: 2px 4px;
        font-size: 0.9rem;
      }

      .project-main {
        flex: 1;
        min-width: 0;
      }

      .project-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }

      .project-name-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .project-item .name {
        flex: 1;
        text-align: left;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .project-item .meta {
        font-size: 0.8rem;
        opacity: 0.8;
        white-space: nowrap;
      }

      .project-details {
        display: none;
        margin-top: 8px;
        padding: 12px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(94, 234, 212, 0.06));
        border: 1px solid rgba(94, 234, 212, 0.12);
        color: var(--text-primary);
        font-size: 0.78rem;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      }

      .project-item.expanded .project-details {
        display: block;
      }

      .project-detail-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .project-trend {
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(96, 165, 250, 0.12);
      }

      .project-trend-title {
        font-size: 0.72rem;
        opacity: 0.75;
        margin-bottom: 6px;
      }

      .project-trend-bars {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 54px;
      }

      .project-trend-bar {
        flex: 1;
        border-radius: 999px 999px 4px 4px;
        background: linear-gradient(180deg, var(--text-accent-2), var(--text-secondary));
        min-height: 6px;
        opacity: 0.85;
      }

      .project-detail-card {
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(96, 165, 250, 0.12);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }

      .project-detail-card .label {
        font-size: 0.7rem;
        opacity: 0.72;
        margin-bottom: 2px;
      }

      .project-detail-card .value {
        font-weight: 700;
        color: var(--text-secondary);
      }

      .project-progress-wrap {
        margin-top: 10px;
      }

      .project-progress {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
        border: 1px solid rgba(96, 165, 250, 0.12);
      }

      .project-progress-fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--text-secondary), var(--text-accent-2));
        transition: width 0.8s ease;
      }

      .project-progress-label {
        margin-top: 4px;
        font-size: 0.72rem;
        opacity: 0.8;
      }

      .project-circle-wrap {
        display: flex;
        justify-content: center;
        margin: 8px 0 10px;
      }

      .project-circle {
        width: 86px;
        height: 86px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(var(--text-secondary) 0deg, var(--text-accent-2) 0deg, rgba(255,255,255,0.08) 0deg);
        position: relative;
        box-shadow: inset 0 0 0 6px rgba(255,255,255,0.08), 0 8px 18px rgba(76, 175, 80, 0.12);
      }

      .project-circle::before {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: rgba(17, 28, 46, 0.98);
      }

      .project-circle .inner {
        position: relative;
        z-index: 1;
        text-align: center;
        font-size: 0.72rem;
      }

      .project-circle .inner strong {
        display: block;
        font-size: 1rem;
        color: var(--text-secondary);
      }

      .project-actions {
        display: flex;
        gap: 6px;
      }

      .project-actions .btn {
        border-radius: 8px;
        padding: 6px 7px;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .project-actions .btn:hover {
        transform: translateY(-1px);
        background: rgba(76, 175, 80, 0.12);
      }

      .inline-input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border-primary);
        border-radius: 6px;
        background: var(--bg-primary);
        color: inherit;
      }

      .status-bar {
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(33, 150, 243, 0.12);
        color: var(--text-accent-2);
        text-align: center;
        font-weight: 600;
        border: 1px solid rgba(33, 150, 243, 0.2);
      }

      .status-bar.is-running {
        background: rgba(76, 175, 80, 0.14);
        color: var(--text-secondary);
        border-color: rgba(76, 175, 80, 0.24);
      }

      .focus-summary-card {
        padding: 12px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(94, 234, 212, 0.16), rgba(96, 165, 250, 0.16));
        border: 1px solid rgba(94, 234, 212, 0.2);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      }

      .focus-summary-card .label {
        font-size: 0.8rem;
        opacity: 0.8;
      }

      .focus-summary-card .value {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-secondary);
      }

      .stats-tabs {
        display: flex;
        gap: 4px;
        padding: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(96, 165, 250, 0.14);
      }

      .stats-tab {
        flex: 1;
        padding: 6px 8px;
        border-radius: 999px;
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 0.8rem;
        transition: var(--transition-base);
      }

      .stats-tab.active {
        background: linear-gradient(135deg, var(--text-secondary), var(--text-accent-2));
        color: #fff;
        box-shadow: 0 4px 10px rgba(76, 175, 80, 0.16);
      }

      .stats-display {
        padding: 10px 12px;
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(33, 150, 243, 0.16), rgba(76, 175, 80, 0.12));
        color: var(--text-accent-2);
        text-align: center;
        font-weight: 700;
        border: 1px solid rgba(33, 150, 243, 0.14);
      }

      .focus-actions {
        display: flex;
        gap: 8px;
      }

      .focus-control-btn {
        flex: 1;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.95rem;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border-primary);
        background: var(--bg-primary);
      }

      .focus-control-btn.is-running {
        background: rgba(76, 175, 80, 0.16);
        color: var(--text-secondary);
        border-color: rgba(76, 175, 80, 0.24);
      }

      .focus-control-btn.is-disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .focus-control-btn.is-danger {
        background: rgba(255, 87, 34, 0.12);
        color: var(--text-accent-1);
        border-color: rgba(255, 87, 34, 0.2);
      }

      .history-panel {
        border-top: 1px solid var(--border-primary);
        padding-top: 10px;
      }

      .history-title {
        font-size: 0.8rem;
        opacity: 0.75;
        margin-bottom: 6px;
      }

      .recent-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 140px;
        overflow: auto;
      }

      .recent-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-primary);
        font-size: 0.8rem;
        opacity: 0.95;
      }

      .recent-item strong {
        font-size: 0.82rem;
        color: var(--text-primary);
      }

      .stats-summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .stat-card {
        padding: 10px;
        border-radius: 6px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-primary);
      }

      .stat-card .label {
        font-size: 0.75rem;
        opacity: 0.8;
      }

      .stat-card .value {
        font-size: 0.95rem;
        font-weight: 700;
        margin-top: 4px;
      }

      .recent-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 120px;
        overflow: auto;
      }

      .recent-item {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.8rem;
        opacity: 0.9;
      }

      .mode-switch {
        display: inline-flex;
        gap: 6px;
        justify-content: flex-start;
        align-self: flex-start;
        width: fit-content;
        padding: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(96, 165, 250, 0.14);
      }

      .mode-btn {
        padding: 6px 10px;
        border-radius: 999px;
        border: none;
        background: transparent;
        color: inherit;
        font-size: 0.84rem;
        min-height: 30px;
        line-height: 1;
      }

      .mode-btn.active {
        background: linear-gradient(135deg, var(--text-secondary), var(--text-accent-2));
        color: #fff;
        box-shadow: 0 4px 10px rgba(76, 175, 80, 0.16);
      }

      .muted {
        opacity: 0.75;
      }

      .hidden {
        display: none !important;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 1000;
      }

      .modal-card {
        width: min(420px, 100%);
        background: var(--bg-secondary);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }

      .modal-title {
        font-size: 1.1rem;
        margin-bottom: 8px;
      }

      .modal-message {
        margin-bottom: 12px;
        line-height: 1.5;
        opacity: 0.9;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 12px;
      }

      .modal-action-btn {
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        background: var(--text-secondary);
        color: white;
        cursor: pointer;
      }

      .modal-action-btn.secondary {
        background: var(--bg-tertiary);
        color: inherit;
      }

      .study-time-display {
        font-size: 3rem;
        font-weight: bold;
        color: var(--text-secondary);
        transition: var(--transition-base);
      }

      /* 番茄钟和空闲钟容器 */
      .timer-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* 番茄钟 */
      .pomodoro {
        background-color: var(--bg-secondary);
        border-radius: 8px;
        padding: 20px;
        flex: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 4px var(--shadow-primary);
        transition: var(--transition-base);
      }

      /* 空闲钟 */
      .idle {
        background-color: var(--bg-secondary);
        border-radius: 8px;
        padding: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 4px var(--shadow-primary);
        transition: var(--transition-base);
      }

      /* 圆形进度条容器 */
      .circular-progress {
        position: relative;
        width: 200px;
        height: 200px;
        margin: 20px 0;
      }

      .circular-progress svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .circular-progress .background {
        fill: none;
        stroke: var(--border-primary);
        stroke-width: 10;
        transition: var(--transition-base);
      }

      .circular-progress .progress {
        fill: none;
        stroke: var(--text-accent-1);
        stroke-width: 10;
        stroke-linecap: round;
        stroke-dasharray: 565.48;
        stroke-dashoffset: 565.48;
        transition: var(--transition-progress);
      }

      .circular-progress .time-display {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2rem;
        font-weight: bold;
        color: inherit;
        transition: var(--transition-base);
      }

      .idle .time-display {
        font-size: 1.5rem;
        font-weight: bold;
        color: inherit;
        transition: var(--transition-base);
      }

      /* 条形进度条 */
      .linear-progress {
        width: 100%;
        height: 20px;
        background-color: var(--border-primary);
        border-radius: 10px;
        margin: 20px 0;
        overflow: hidden;
        transition: var(--transition-base);
      }

      .linear-progress .progress {
        height: 100%;
        background-color: var(--text-accent-2);
        width: 0%;
        transition: var(--transition-progress);
      }

      /* 时间输入 */
      .time-input {

    <script src="./app-logic.js?v=4"></script>
    <script>
      /*
        页面脚本主入口说明：
        - showAppModal / showAppConfirm：统一的弹窗服务。
        - dataManager：负责从 localStorage 读取和写入状态。
        - PomodoroTimer / IdleTimer：两个计时器实例，分别处理番茄钟与空闲钟。
        - FocusManager / StudyTimeManager：专注任务与总学习时长的 UI 与状态控制。
        - PWA 相关逻辑：注册 Service Worker、安装提示、可见性处理与离开提醒。
      */

      function showAppModal({ title, message, input = false, initialValue = "", confirmText = "确认", cancelText = "取消" }) {
        return new Promise((resolve) => {
          const overlay = document.getElementById("app-modal");
          const titleEl = document.getElementById("modal-title");
          const messageEl = document.getElementById("modal-message");
          const inputEl = document.getElementById("modal-input");
          const cancelBtn = document.querySelector(".modal-cancel-btn");
          const confirmBtn = document.querySelector(".modal-confirm-btn");

          const finish = (value) => {
            overlay.classList.add("hidden");
            inputEl.classList.add("hidden");
            inputEl.value = "";
            cancelBtn.onclick = null;
            confirmBtn.onclick = null;
            overlay.onclick = null;
            inputEl.onkeydown = null;
            resolve(value);
          };

          titleEl.textContent = title;
          messageEl.textContent = message;
          inputEl.classList.toggle("hidden", !input);
          inputEl.value = initialValue;
          cancelBtn.textContent = cancelText;
          confirmBtn.textContent = confirmText;
          overlay.classList.remove("hidden");

          cancelBtn.onclick = () => finish(null);
          confirmBtn.onclick = () => finish(input ? inputEl.value : true);
          overlay.onclick = (event) => {
            if (event.target === overlay) {
              finish(null);
            }
          };
          inputEl.onkeydown = (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              finish(input ? inputEl.value : true);
            }
          };

          if (input) {
            inputEl.focus();
            inputEl.select();
          }
        });
      }

      async function showAppConfirm(message) {
        const result = await showAppModal({
          title: "确认",
          message,
          input: false,
          confirmText: "确认",
          cancelText: "取消",
        });
        return result === true;
      }

      // 数据管理层：统一封装状态读取、保存和格式化逻辑。
      const dataManager = {
        // 初始化数据
        init() {
          const raw = localStorage.getItem("timerData");
          let parsed = null;
          try {
            parsed = raw ? JSON.parse(raw) : null;
          } catch (error) {
            parsed = null;
          }
          const data = AppLogic.normalizeState(parsed);
          data.totalStudyTime = Number(data.totalStudyTime) || 0;
          data.pomodoroTime = Number(data.pomodoroTime) || 1500;
          data.idleTime = Number(data.idleTime) || 300;
          data.timer.duration = Number(data.timer.duration) || data.pomodoroTime;
          data.timer.remaining = Number(data.timer.remaining) || data.timer.duration;
          return data;
        },

        // 保存数据
        save(data) {
          const normalized = AppLogic.normalizeState(data);
          normalized.totalStudyTime = Number(normalized.totalStudyTime) || 0;
          normalized.pomodoroTime = Number(normalized.pomodoroTime) || 1500;
          normalized.idleTime = Number(normalized.idleTime) || 300;
          normalized.timer.duration = Number(normalized.timer.duration) || normalized.pomodoroTime;
          normalized.timer.remaining = Number(normalized.timer.remaining) || normalized.timer.duration;
          localStorage.setItem("timerData", JSON.stringify(normalized));
          return normalized;
        },

        // 格式化时间（秒转 HH:MM）
        formatTime(seconds) {
          const hours = Math.floor(seconds / 3600);
          const minutes = Math.floor((seconds % 3600) / 60);
          return `${hours}:${minutes.toString().padStart(2, "0")}`;
        },

        // 格式化倒计时（秒转 MM:SS）
        formatCountdown(seconds) {
          const minutes = Math.floor(seconds / 60);
          const secs = seconds % 60;
          return `${minutes}:${secs.toString().padStart(2, "0")}`;
        },
      };

      // 番茄钟控制器：负责倒计时、进度展示、完成后记录总学习时间和提醒。
      class PomodoroTimer {
        constructor(element) {
          this.element = element;
          this.timeInput = element.querySelector(".time-input");
          this.startBtn = element.querySelector(".start-btn");
          this.pauseBtn = element.querySelector(".pause-btn");
          this.stopBtn = element.querySelector(".stop-btn");
          this.progressCircle = element.querySelector(
            ".circular-progress .progress"
          );
          this.circumference = 2 * Math.PI * 90; // 圆的周长

          this.data = dataManager.init();
          this.totalTime = this.data.pomodoroTime;
          this.remainingTime = this.totalTime;
          this.isRunning = false;
          this.interval = null;

          this.init();
        }

        init() {
          this.timeInput.value = dataManager.formatCountdown(
            this.remainingTime
          );
          this.updateProgress();

          // 确保初始状态下输入框可编辑
          this.timeInput.readOnly = false;

          // 事件监听
          this.startBtn.addEventListener("click", () => this.start());
          this.pauseBtn.addEventListener("click", () => this.pause());
          this.stopBtn.addEventListener("click", () => this.stop());

          // 允许编辑时间
          this.timeInput.addEventListener("blur", () => {
            if (!this.isRunning) {
              const timeParts = this.timeInput.value.split(":");
              if (timeParts.length === 2) {
                const minutes = parseInt(timeParts[0], 10);
                const seconds = parseInt(timeParts[1], 10);

                // 验证输入
                if (
                  !isNaN(minutes) &&
                  !isNaN(seconds) &&
                  minutes >= 0 &&
                  minutes <= 1440 &&
                  seconds >= 0 &&
                  seconds <= 59
                ) {
                  this.totalTime = minutes * 60 + seconds;
                  this.remainingTime = this.totalTime;
                  this.data.pomodoroTime = this.totalTime;
                  dataManager.save(this.data);
                  this.updateProgress();
                } else {
                  // 输入无效，重置为之前的有效值
                  this.timeInput.value = dataManager.formatCountdown(
                    this.remainingTime
                  );
                }
              } else {
                // 格式无效，重置为之前的有效值
                this.timeInput.value = dataManager.formatCountdown(
                  this.remainingTime
                );
              }
            }
          });

          // 限制输入格式
          this.timeInput.addEventListener("input", (e) => {
            let value = e.target.value;
            // 只允许数字和冒号
            value = value.replace(/[^0-9:]/g, "");

            // 处理冒号位置
            const colonIndex = value.indexOf(":");

            if (colonIndex === -1) {
              // 没有冒号，自动在倒数第二位前添加冒号
              if (value.length >= 3) {
                value = value.slice(0, -2) + ":" + value.slice(-2);
              }
            } else {
              // 有冒号，确保冒号后只有两位数字
              const parts = value.split(":");
              if (parts.length === 2) {
                const minutes = parts[0];
                let seconds = parts[1];

                // 限制秒数为两位
                if (seconds.length > 2) {
                  seconds = seconds.slice(0, 2);
                }

                value = minutes + ":" + seconds;
              }
            }

            // 限制总长度（分钟最多4位 + 冒号 + 秒数2位 = 7位）
            if (value.length > 7) {
              value = value.slice(0, 7);
            }

            e.target.value = value;
          });
        }

        start() {
          if (!this.isRunning) {
            this.isRunning = true;
            this.timeInput.readOnly = true;
            this.startBtn.style.display = "none";
            this.pauseBtn.style.display = "inline-block";
            this.stopBtn.style.display = "inline-block";

            this.interval = setInterval(() => {
              this.remainingTime--;
              this.timeInput.value = dataManager.formatCountdown(
                this.remainingTime
              );
              this.updateProgress();

              if (this.remainingTime <= 0) {
                this.complete();
              }
            }, 1000);
          }
        }

        pause() {
          if (this.isRunning) {
            this.isRunning = false;
            clearInterval(this.interval);
            this.startBtn.style.display = "inline-block";
            this.pauseBtn.style.display = "none";
          }
        }

        stop() {
          this.isRunning = false;
          clearInterval(this.interval);

          // 将已进行的时间加入总学习时长
          const elapsed = this.totalTime - this.remainingTime;
          this.data.totalStudyTime += elapsed;
          this.data = dataManager.save(this.data);
          studyTimeManager.refresh();

          // 重置计时器
          this.remainingTime = this.totalTime;
          this.timeInput.value = dataManager.formatCountdown(
            this.remainingTime
          );
          this.timeInput.readOnly = false;
          this.updateProgress();

          this.startBtn.style.display = "inline-block";
          this.pauseBtn.style.display = "none";
          this.stopBtn.style.display = "none";
        }

        complete() {
          this.isRunning = false;
          clearInterval(this.interval);

          // 将全部时间加入总学习时长
          this.data.totalStudyTime += this.totalTime;
          this.data = dataManager.save(this.data);
          studyTimeManager.refresh();

          // 重置计时器
          this.remainingTime = this.totalTime;
          this.timeInput.value = dataManager.formatCountdown(
            this.remainingTime
          );
          this.timeInput.readOnly = false;
          this.updateProgress();

          this.startBtn.style.display = "inline-block";
          this.pauseBtn.style.display = "none";
          this.stopBtn.style.display = "none";

          // 发送通知
          this.sendNotification("番茄钟完成", "恭喜你完成了一个番茄钟！");
        }

        updateProgress() {
          const progress =
            (this.totalTime - this.remainingTime) / this.totalTime;
          const offset = this.circumference - progress * this.circumference;
          this.progressCircle.style.strokeDashoffset = offset;
        }

        sendNotification(title, message) {
          if ("Notification" in window) {
            if (Notification.permission === "granted") {
              new Notification(title, { body: message });
            } else if (Notification.permission !== "denied") {
              Notification.requestPermission().then((permission) => {
                if (permission === "granted") {
                  new Notification(title, { body: message });
                }
              });
            }
          }

          // 播放声音
          const audio = new Audio(
            "data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmFgU7k9n1unEiBC13yO/eizEIHWq+8+OWT"
          );
          audio.play();
        }
      }

                // 格式无效，重置为之前的有效值

          // 限制输入格式

        start() {

      // 专注累计管理器：负责任务创建/重命名/删除、任务切换、会话累计和统计渲染。
      class FocusManager {
        constructor() {
          this.state = dataManager.init();
          this.listEl = document.getElementById("project-list");
          this.statusEl = document.getElementById("focus-status");
          this.historyEl = document.getElementById("focus-history");
          this.focusPanel = document.querySelector(".focus-panel");
          this.timerContainer = document.querySelector(".timer-container");
          this.periodBtns = Array.from(document.querySelectorAll(".stats-tab"));
          this.statsValueEl = document.getElementById("focus-stats-value");
          this.selectedPeriod = "day";
          this.startBtn = document.querySelector(".start-focus-btn");
          this.stopBtn = document.querySelector(".stop-focus-btn");
          this.addBtn = document.querySelector(".add-project-btn");
          this.todayTotalEl = document.getElementById("today-focus-total");
          this.modeBtns = Array.from(document.querySelectorAll(".mode-btn"));
          this.tickHandle = null;
          this.init();
        }

        init() {
          this.render();
          this.bindEvents();
        }

        bindEvents() {
          this.addBtn.addEventListener("click", async () => {
            const name = await showAppModal({
              title: "新建任务",
              message: "请输入任务名称",
              input: true,
              initialValue: "新任务",
              confirmText: "创建",
            });
            if (!name) {
              return;
            }
            AppLogic.createProject(this.state, name);
            this.persist();
            this.render();
          });

          this.startBtn.addEventListener("click", async () => {
            const active = AppLogic.getActiveProject(this.state);
            if (!active) {
              await showAppModal({
                title: "提示",
                message: "请先创建一个任务",
                input: false,
                confirmText: "知道了",
                cancelText: "关闭",
              });
              return;
            }
            if (this.state.focus.isRunning) {
              return;
            }
            const confirmMessage = `确认开始为“${active.name}”累计专注时间吗？开始后将以静默方式记录时长。`;
            const confirmed = await showAppConfirm(confirmMessage);
            if (!confirmed) {
              return;
            }
            this.state.focus.isRunning = true;
            this.state.focus.runningSince = Date.now();
            this.state.focus.lastUpdated = Date.now();
            this.state.focus.currentSessionSeconds = 0;
            this.startTick();
            this.persist();
            this.render();
          });

          this.stopBtn.addEventListener("click", () => {
            this.finishSession();
          });

          this.modeBtns.forEach((btn) => {
            btn.addEventListener("click", () => {
              const nextMode = btn.dataset.mode;
              if (nextMode === "focus") {
                this.state.mode = "focus";
              } else {
                this.state.mode = "timer";
              }
              this.persist();
              this.render();
            });
          });

          this.periodBtns.forEach((btn) => {
            btn.addEventListener("click", () => {
              this.selectedPeriod = btn.dataset.period || "day";
              this.render();
            });
          });
        }

        startTick() {
          if (this.tickHandle) {
            clearInterval(this.tickHandle);
          }
          this.tickHandle = setInterval(() => {
            if (!this.state.focus.isRunning || !this.state.focus.runningSince) {
              return;
            }
            this.state.focus.currentSessionSeconds = Math.floor((Date.now() - this.state.focus.runningSince) / 1000);
            this.render();
          }, 1000);
        }

        stopTick() {
          if (this.tickHandle) {
            clearInterval(this.tickHandle);
            this.tickHandle = null;
          }
        }

        finishSession() {
          if (!this.state.focus.isRunning) {
            return;
          }
          const active = AppLogic.getActiveProject(this.state);
          const elapsed = Math.max(1, Math.floor((Date.now() - this.state.focus.runningSince) / 1000));
          if (active) {
            AppLogic.addElapsedToProject(this.state, active.id, elapsed);
            AppLogic.recordFocusSession(this.state, active.id, active.name, this.state.focus.runningSince, Date.now(), elapsed);
            this.state.totalStudyTime += elapsed;
          }
          this.state.focus.isRunning = false;
          this.state.focus.runningSince = null;
          this.state.focus.currentSessionSeconds = 0;
          this.stopTick();
          this.persist();
          this.render();
        }

        persist() {
          this.state = dataManager.save(this.state);
          if (typeof studyTimeManager !== "undefined") {
            studyTimeManager.refresh();
          }
        }

        render() {
          this.modeBtns.forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.mode === this.state.mode);
          });

          if (this.focusPanel) {
            this.focusPanel.classList.toggle("hidden", this.state.mode !== "focus");
          }
          if (this.timerContainer) {
            this.timerContainer.classList.toggle("hidden", this.state.mode !== "timer");
          }

          this.listEl.innerHTML = "";
          this.state.focus.projects.forEach((project) => {
            const isActive = project.id === this.state.focus.activeProjectId;
            const displaySeconds = this.state.focus.isRunning && isActive
              ? this.state.focus.currentSessionSeconds
              : project.totalSeconds;
            const item = document.createElement("div");
            item.className = `project-item${isActive ? " active" : ""}${this.state.focus.isRunning && isActive ? " running" : ""}`;
            item.classList.toggle("expanded", isActive);
            const progressSeconds = this.state.focus.isRunning && isActive
              ? this.state.focus.currentSessionSeconds
              : project.todaySeconds;
            const progressTargetSeconds = 25 * 60;
            const progressRatio = Math.min(1, Math.max(0, progressSeconds / progressTargetSeconds));
            const badgeText = this.state.focus.isRunning && isActive ? "进行中" : isActive ? "当前任务" : "任务";
            item.innerHTML = `
              <button class="project-toggle" type="button" aria-label="展开详情">▾</button>
              <div class="project-main">
                <div class="project-header">
                  <div class="project-name-row">
                    <span class="project-status-light${this.state.focus.isRunning && isActive ? " is-running" : ""}"></span>
                    <span class="project-badge${this.state.focus.isRunning && isActive ? " is-running" : ""}">${badgeText}</span>
                    <div class="name">${project.name}</div>
                  </div>
                  <div class="meta">${AppLogic.formatDuration(displaySeconds)}</div>
                </div>
                <div class="project-details">
                  <div class="project-circle-wrap">
                    <div class="project-circle" style="background: conic-gradient(var(--text-secondary) ${Math.round(progressRatio * 360)}deg, var(--text-accent-2) ${Math.round(progressRatio * 360)}deg, var(--bg-primary) 0deg);">
                      <div class="inner">
                        <div>进度</div>
                        <strong>${Math.round(progressRatio * 100)}%</strong>
                      </div>
                    </div>
                  </div>
                  <div class="project-detail-grid">
                    <div class="project-detail-card">
                      <div class="label">累计</div>
                      <div class="value">${AppLogic.formatDuration(project.totalSeconds)}</div>
                    </div>
                    <div class="project-detail-card">
                      <div class="label">今日</div>
                      <div class="value">${AppLogic.formatDuration(project.todaySeconds)}</div>
                    </div>
                  </div>
                  <div class="project-trend">
                    <div class="project-trend-title">专注时长趋势</div>
                    <div class="project-trend-bars">
                      ${[20, 35, 28, 40, 32, 25].map((height) => `<div class="project-trend-bar" style="height: ${height}%"></div>`).join("")}
                    </div>
                  </div>
                  <div class="project-progress-wrap">
                    <div class="project-progress">
                      <div class="project-progress-fill" style="width: ${Math.round(progressRatio * 100)}%"></div>
                    </div>
                    <div class="project-progress-label">目标 25 分钟 • 当前 ${AppLogic.formatDuration(progressSeconds)}</div>
                  </div>
                </div>
              </div>
            `;
            const toggleBtn = item.querySelector(".project-toggle");
            toggleBtn.addEventListener("click", (event) => {
              event.stopPropagation();
              item.classList.toggle("expanded");
            });
            item.querySelector(".project-header").addEventListener("click", async () => {
              if (this.state.focus.isRunning && this.state.focus.activeProjectId !== project.id) {
                const current = AppLogic.getActiveProject(this.state);
                const confirmed = await showAppConfirm(`当前任务“${current?.name || "未命名"}”已在累计，切换将结束本次记录，是否继续？`);
                if (!confirmed) {
                  return;
                }
                this.finishSession();
              }
              this.state.focus.activeProjectId = project.id;
              this.persist();
              this.render();
            });
            const actionWrap = document.createElement("div");
            actionWrap.className = "project-actions";
            const renameBtn = document.createElement("button");
            renameBtn.textContent = "✏️";
            renameBtn.className = "btn";
            renameBtn.addEventListener("click", async (event) => {
              event.stopPropagation();
              const nextName = await showAppModal({
                title: "重命名任务",
                message: "请输入新名称",
                input: true,
                initialValue: project.name,
                confirmText: "保存",
              });
              if (!nextName) {
                return;
              }
              AppLogic.renameProject(this.state, project.id, nextName);
              this.persist();
              this.render();
            });
            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "🗑️";
            deleteBtn.className = "btn";
            deleteBtn.addEventListener("click", async (event) => {
              event.stopPropagation();
              const confirmed = await showAppConfirm(`确认删除任务“${project.name}”吗？`);
              if (!confirmed) {
                return;
              }
              AppLogic.removeProject(this.state, project.id);
              this.persist();
              this.render();
            });
            actionWrap.appendChild(renameBtn);
            actionWrap.appendChild(deleteBtn);
            item.appendChild(actionWrap);
            this.listEl.appendChild(item);
          });

          const active = AppLogic.getActiveProject(this.state);
          const todayTotalSeconds = this.state.focus.projects.reduce((sum, project) => sum + (Number(project.todaySeconds) || 0), 0);
          if (this.todayTotalEl) {
            this.todayTotalEl.textContent = AppLogic.formatDuration(todayTotalSeconds);
          }
          if (active) {
            const elapsedSeconds = this.state.focus.isRunning
              ? this.state.focus.currentSessionSeconds
              : active.totalSeconds;
            this.statusEl.textContent = this.state.focus.isRunning
              ? `⏳ 正在专注：${active.name}（${AppLogic.formatDuration(elapsedSeconds)}）`
              : `当前项目：${active.name}（${AppLogic.formatDuration(active.totalSeconds)}）`;
          } else {
            this.statusEl.textContent = "当前未开始专注";
          }

          this.statusEl.classList.toggle("is-running", this.state.focus.isRunning);
          if (this.focusPanel) {
            this.focusPanel.classList.toggle("is-running", this.state.focus.isRunning);
          }

          this.periodBtns.forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.period === this.selectedPeriod);
          });

          const summary = AppLogic.summarizeFocusHistory(this.state.focus.history, {
            referenceDate: new Date(),
            projectId: active ? active.id : null,
          });
          const selectedSummary = summary[this.selectedPeriod] || 0;
          if (this.statsValueEl) {
            this.statsValueEl.textContent = AppLogic.formatDuration(selectedSummary);
          }

          if (this.historyEl) {
            const recentRecords = (this.state.focus.history || []).slice(0, 6);
            this.historyEl.innerHTML = recentRecords.length
              ? recentRecords.map((entry) => {
                  const timeLabel = entry.startedAt
                    ? new Date(entry.startedAt).toLocaleString("zh-CN", {
                        month: "numeric",
                        day: "numeric",
                        hour: "2-digit",
                        minute: "2-digit",
                      })
                    : "刚刚";
                  return `<div class="recent-item"><div><strong>${entry.projectName || "项目"}</strong><div>${AppLogic.formatDuration(entry.durationSeconds)}</div></div><span>${timeLabel}</span></div>`;
                }).join("")
              : '<div class="recent-item"><div><strong>暂无专注记录</strong><div>开始计时后会显示这里</div></div><span>—</span></div>';
          }

          if (this.startBtn) {
            this.startBtn.classList.toggle("is-running", this.state.focus.isRunning);
            this.startBtn.classList.toggle("is-disabled", !active);
            this.startBtn.textContent = this.state.focus.isRunning ? "⏸ 暂停" : "▶ 开始";
            this.startBtn.title = this.state.focus.isRunning ? "暂停当前专注" : "开始专注";
          }
          if (this.stopBtn) {
            this.stopBtn.classList.toggle("is-danger", this.state.focus.isRunning);
            this.stopBtn.classList.toggle("is-disabled", !this.state.focus.isRunning);
            this.stopBtn.textContent = this.state.focus.isRunning ? "⏹ 结束" : "⏹ 结束";
            this.stopBtn.title = this.state.focus.isRunning ? "结束本次专注" : "结束本次专注";
          }
        }
      }

          this.init();

            this.clearStudyTime()
          );
          this.cancelBtn.addEventListener("click", () =>
            this.hideConfirmDialog()
          );
        }

          this.display.textContent = dataManager.formatTime(

          this.cancelBtn.style.display = "none";

          // 隐藏确认和取消按钮，显示清空按钮
          this.hideConfirmDialog();

      // 初始化应用
      const data = dataManager.init();

      // 初始化番茄钟
      const pomodoroElement = document.querySelector(".pomodoro");

      // 监听安装提示事件
      window.addEventListener("beforeinstallprompt", (e) => {
        // 阻止默认的安装提示
        e.preventDefault();
        // 存储事件以便后续使用
        deferredPrompt = e;

        // 检查用户是否已经安装了应用
        if (!localStorage.getItem("pwa-install-dismissed")) {

      // 隐藏安装提示的函数
      function hideInstallPrompt() {
        installPromptElement.classList.add("install-prompt-dismiss");
        setTimeout(() => {
          installPromptElement.style.display = "none";
          installPromptElement.classList.remove("install-prompt-dismiss");

      // 处理应用启动时的 URL 参数
      function handleAppAction() {
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get("action");

        if (action === "pomodoro") {
          // 自动开始番茄钟
          setTimeout(() => {
            if (!pomodoroTimer.isRunning) {
              pomodoroTimer.start();
            }
          }, 1000);
        } else if (action === "idle") {
          // 自动开始空闲钟
          setTimeout(() => {
            if (!idleTimer.isRunning) {
              idleTimer.start();
            }
          }, 1000);
        } else if (action === "stats") {
          // 高亮显示学习时长区域
          const studyTimeElement = document.querySelector(".study-time");
          studyTimeElement.style.animation = "pulse 2s ease-in-out 3";

          const pulseStyle = document.createElement("style");
          pulseStyle.textContent = `
            @keyframes pulse {
              0%, 100% { transform: scale(1); }
              50% { transform: scale(1.05); }
            }
          `;
          document.head.appendChild(pulseStyle);

          setTimeout(() => {
            studyTimeElement.style.animation = "";
          }, 6000);
        }
      }

      // 处理应用启动
      handleAppAction();

      // 请求通知权限
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }

      // 处理页面可见性变化
      let lastVisibleTime = Date.now();

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          // 页面变为可见时，计算经过的时间并更新计时器
          const now = Date.now();
          const elapsedSeconds = Math.floor((now - lastVisibleTime) / 1000);

          if (pomodoroTimer.isRunning) {
            pomodoroTimer.remainingTime = Math.max(
              0,
              pomodoroTimer.remainingTime - elapsedSeconds
            );
            pomodoroTimer.timeInput.value = dataManager.formatCountdown(
              pomodoroTimer.remainingTime
            );
            pomodoroTimer.updateProgress();

            if (pomodoroTimer.remainingTime <= 0) {
              pomodoroTimer.complete();
            }
          }

          if (idleTimer.isRunning) {
            idleTimer.remainingTime = Math.max(
              0,
              idleTimer.remainingTime - elapsedSeconds
            );
            idleTimer.timeInput.value = dataManager.formatCountdown(
              idleTimer.remainingTime
            );
            idleTimer.updateProgress();

            if (idleTimer.remainingTime <= 0) {
              idleTimer.complete();
            }
          }
        }

        lastVisibleTime = Date.now();
      });

      // 页面关闭前提醒
      window.addEventListener("beforeunload", (e) => {
        if (pomodoroTimer.isRunning || idleTimer.isRunning) {
          e.preventDefault();
          e.returnValue = "您有正在运行的计时器，确定要离开吗？";
          return e.returnValue;
        }
      });
    </script>
  </body>
</html>
